api:
  # Prefer an environment variable; never commit a real API key
  api_key_env: DASHSCOPE_API_KEY
  # Beijing region example; use the endpoint for your DashScope workspace region
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
models:
  asr: qwen-audio-3.1-asr-flash
  fusion: qwen3.8-flash
processing:
  audio_chunk_seconds: 120
  audio_overlap_seconds: 4
  audio_bitrate_kbps: 32
  frame_interval_seconds: 15
  max_frames: 120
  # Locate the PPT region using up to three representative frames; choose one of the consistent original boxes
  frame_region_detection: true
  # If detection is inaccurate, set [left, top, right, bottom] manually using normalized 0-1 coordinates
  # frame_compare_region: [0.27, 0.16, 0.98, 0.76]
  # Start a new group when the mean grayscale difference reaches this percentage; retain each group's last frame
  frame_similarity_threshold: 3.0
  vision_batch_size: 8
  default_images: true
  # Keep raw fusion responses and validation results on success; failed jobs retain them for debugging
  keep_fusion_responses: false
  output_language: zh
telegram:
  # BotFather Token (includes the Bot ID), or use TELEGRAM_BOT_TOKEN
  bot_token: ""
  bot_token_env: TELEGRAM_BOT_TOKEN
  # Enter your allowed chat IDs; an empty list permits all users
  allowed_chat_ids: []
  poll_timeout_seconds: 30
